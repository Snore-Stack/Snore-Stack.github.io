name: Release

on:
  workflow_run:
    workflows: ["Deploy MkDocs to GitHub Pages"] # Nom exact du workflow de deploy.yml
    types:
      - completed

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Condition indispensable : ne s'exécute QUE si le deploy a RÉUSSI !
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm clean-install

      - name: Verify dependencies signatures
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
