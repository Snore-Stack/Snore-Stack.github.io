services:
  webp-converter:
    image: snore-stack/cwebp
    volumes:
      - ./docs/assets:/assets
    build:
      context: .
      dockerfile: Dockerfile
  mkdocs:
    image: squidfunk/mkdocs-material:9
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr=0.0.0.0:8000 --livereload
    depends_on:
      - webp-converter
